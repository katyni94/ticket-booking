<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бронирование мест - Концертный зал</title>
<style>
  :root{
    --bg:#0f1319; --panel:#171d27; --seat-default:#2a3342; --seat-hover:#3a475c;
    --accent:#3b82f6; --selected:#f59e0b; --booked:#5a2a36; --blocked:#000000;
    --text:#e6ebf2; --muted:#8b97a8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:20px 10px 100px;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 500px at 50% -10%,#1b2434,#0f1319);
    color:var(--text); display:flex; flex-direction:column; align-items:center;
  }
  h1{font-size:22px; margin:0 0 4px; font-weight:600; text-align:center}
  .sub{color:var(--muted); font-size:13px; margin-bottom:15px; text-align:center}

  /* Переключатель событий */
  .event-switch {
    display: flex; gap: 10px; margin-bottom: 20px; background: #171d27; padding: 5px; border-radius: 12px;
  }
  .event-switch button {
    background: transparent; color: var(--muted); border: none; padding: 10px 20px; border-radius: 8px; 
    font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px;
  }
  .event-switch button.active {
    background: var(--accent); color: #fff;
  }
  
  .stage{
    width:min(400px,80%); height:40px; border-radius:0 0 50% 50%;
    background:#2a3446; display:flex; align-items:center; justify-content:center;
    color:#8b97a8; font-weight:600; letter-spacing:2px; text-transform:uppercase;
    margin-bottom:30px; border-top:4px solid #1f2735;
  }

  .zone-title{font-size:11px; color:var(--muted); text-transform:uppercase; margin:15px 0 5px; font-weight:600; text-align:center}
  
  .hall-wrap{width:100%; max-width:100%; overflow-x:auto; padding-bottom:20px; display:flex; justify-content:center;}
  
  /* Раскладка */
  .hall-layout { display: flex; justify-content: center; gap: 30px; align-items: flex-start; }
  
  /* Балконы и Центр */
  .col { display: flex; flex-direction: column; align-items: center; }
  
  /* Строки и места */
  .row { display: flex; gap: 4px; justify-content: center; margin-bottom: 4px; min-height: 20px; }
  
  /* Проходы */
  .aisle { height: 20px; flex-shrink: 0; } 
  
  /* Диджейская стойка */
  .dj-booth {
    height: 20px; background: #333; border: 1px solid #555; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #aaa;
  }

  .seat{
    width: 20px; height: 20px; border:0; border-radius:4px 4px 1px 1px;
    background:var(--seat-default); color:#fff; font-size:9px; cursor:pointer;
    transition:transform .1s, opacity .2s; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; text-shadow: 1px 1px 1px #000;
  }
  .seat:hover:not(.booked):not(.blocked):not(.disabled){transform:scale(1.15); z-index: 10;}
  .seat.selected{background:var(--selected) !important; color:#1a1206; box-shadow:0 0 0 2px rgba(245,158,11,.6); text-shadow: none;}
  .seat.booked{background:var(--booked) !important; color:transparent; cursor:not-allowed;}
  .seat.blocked{background:var(--blocked) !important; color:transparent; cursor:not-allowed; border:1px solid #333;}
  
  /* Неактивная половина зала */
  .seat.disabled{opacity: 0.15; cursor: not-allowed; filter: grayscale(100%);}

  /* Легенда */
  .legend{display:flex; gap:15px; flex-wrap:wrap; justify-content:center; margin:15px 0; font-size:12px; color:var(--muted)}
  .legend span{display:flex; align-items:center; gap:5px}
  .dot{width:12px; height:12px; border-radius:3px; display:inline-block}

  /* Панель */
  .bar{
    position:fixed; left:0; right:0; bottom:0; background:rgba(23,29,39,.96);
    border-top:1px solid #222b39; padding:10px 16px; display:flex; align-items:center; justify-content:center; gap:15px; flex-wrap:wrap;
    backdrop-filter:blur(8px); z-index: 100;
  }
  .btn{border:0; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; transition:.15s;}
  .btn.primary{background:var(--accent); color:#fff}
  .btn.primary:hover:not(:disabled){background:#2f6fd6}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .btn.ghost{background:#242d3b; color:var(--text)}
  .btn.ghost:hover{background:#2e3a4c}
  .btn.admin{background:#7c3aed; color:#fff; margin-left: 15px;}
  .btn.admin.active{background:#ef4444; box-shadow: 0 0 10px #ef4444;}

  /* Модалки */
  .modal{position:fixed; inset:0; z-index:200; background:rgba(5,8,12,.8); display:flex; align-items:center; justify-content:center; padding:16px}
  .modal[hidden]{display:none}
  .modal-card{background:var(--panel); border-radius:16px; padding:24px; width:100%; max-width:390px}
  .modal-seats{color:var(--muted); font-size:13px; white-space:pre-line; margin:0 0 15px; line-height:1.5}
  input{width:100%; margin-top:5px; margin-bottom:15px; padding:11px; border-radius:8px; border:1px solid #2a3446; background:#111721; color:var(--text);}
  .error{color:#f87171; font-size:13px; margin-top:10px; min-height:16px;}
  
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#1a8a4d; color:#fff; padding:10px 20px; border-radius:8px; opacity:0; transition:.3s; pointer-events:none; z-index:300;}
  .toast.show{opacity:1;}

  /* КАСТОМНЫЙ TOOLTIP */
  #tooltip {
    position: fixed; z-index: 999; background: #fff; color: #111; border-radius: 8px;
    padding: 10px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: none;
    display: none; text-align: center; font-size: 13px; min-width: 150px;
    transform: translate(-50%, -120%); /* Позиционируем над курсором */
  }
  #tooltip .t-row { font-weight: 700; font-size: 15px; margin-bottom: 2px; color: #000; }
  #tooltip .t-zone { color: #666; font-size: 12px; margin-bottom: 4px; }
  #tooltip .t-price { font-weight: 600; color: #222; }
</style>
</head>
<body>

<h1>Концертный зал</h1>
<div class="sub">25 ноября в 19:00</div>

<!-- Переключатель событий -->
<div class="event-switch">
  <button id="btn-event-left" class="active" onclick="switchEvent('left')">Танцы без возраста (Левая часть)</button>
  <button id="btn-event-right" onclick="switchEvent('right')">Живи ярче (Правая часть)</button>
</div>

<div class="stage">СЦЕНА</div>

<div class="hall-wrap">
  <div class="hall-layout">
    <!-- ЛЕВАЯ КОЛОНКА (Балконы Б и А) -->
    <div class="col">
      <div class="zone-title">Левый балкон Б</div>
      <div id="left-balc-b"></div>
      <div class="zone-title" style="margin-top:20px">Левый балкон А</div>
      <div id="left-balc-a"></div>
    </div>

    <!-- ЦЕНТР (ПАРТЕР И ЦБ) -->
    <div class="col">
      <div class="zone-title">Партер</div>
      <div id="parterre"></div>
      
      <div class="zone-title" style="margin-top:30px">Центральный балкон</div>
      <div id="central-balc"></div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА (Балконы Б и А) -->
    <div class="col">
      <div class="zone-title">Правый балкон Б</div>
      <div id="right-balc-b"></div>
      <div class="zone-title" style="margin-top:20px">Правый балкон А</div>
      <div id="right-balc-a"></div>
    </div>
  </div>
</div>

<!-- ЛЕГЕНДА -->
<div class="legend">
  <span><i class="dot" style="background:#2a3342"></i>свободно</span>
  <span><i class="dot" style="background:#f59e0b"></i>выбрано</span>
  <span><i class="dot" style="background:#5a2a36"></i>занято</span>
  <span><i class="dot" style="background:#000; border:1px solid #555"></i>не продается</span>
</div>
<div class="legend" style="margin-top:-5px;">
  <span><i class="dot" style="background:#ef4444"></i>1500₽</span>
  <span><i class="dot" style="background:#fca5a5"></i>1400₽</span>
  <span><i class="dot" style="background:#f97316"></i>1300₽</span>
  <span><i class="dot" style="background:#eab308"></i>1100₽</span>
  <span><i class="dot" style="background:#22c55e"></i>1000₽</span>
  <span><i class="dot" style="background:#86efac"></i>800₽</span>
  <span><i class="dot" style="background:#60a5fa"></i>600₽</span>
</div>

<div class="bar">
  <div>Выбрано: <b id="count">0</b></div>
  <button class="btn ghost" id="cancelBtnOpen">Отменить бронь</button>
  <button class="btn primary" id="bookBtn" disabled>Забронировать</button>
  <button class="btn admin" id="adminBtn">Войти как Админ</button>
</div>

<!-- МОДАЛКИ -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h2>Подтверждение брони</h2>
    <p class="modal-seats" id="modalSeats"></p>
    <form id="bookingForm" novalidate>
      <label>Имя и Фамилия <input id="fullname" type="text" placeholder="Иван Иванов"></label>
      <label>Номер телефона <input id="phone" type="tel" placeholder="+7 999 123-45-67"></label>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn ghost" style="flex:1" onclick="document.getElementById('modal').hidden = true">Отмена</button>
        <button type="submit" class="btn primary" style="flex:1" id="submitBtn">Забронировать</button>
      </div>
      <p class="error" id="error"></p>
    </form>
  </div>
</div>

<div class="modal" id="cancelModal" hidden>
  <div class="modal-card">
    <h2>Отмена брони</h2>
    <label>Номер телефона <input id="cancelPhone" type="tel"></label>
    <div style="display:flex; gap:10px;">
      <button type="button" class="btn ghost" style="flex:1" onclick="document.getElementById('cancelModal').hidden = true">Закрыть</button>
      <button type="button" class="btn primary" style="flex:1" onclick="findMyBookings()">Найти</button>
    </div>
    <div id="myBookingsList" style="margin-top:15px; display:none;">
       <div id="seatsToCancel" style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;"></div>
       <button type="button" class="btn primary" style="width:100%; background:#ef4444;" onclick="cancelBookings()">Отменить выбранные</button>
    </div>
  </div>
</div>

<!-- TOOLTIP -->
<div id="tooltip">
  <div class="t-row" id="tt-row">Ряд: 8, место: 23</div>
  <div class="t-zone" id="tt-zone">Партер</div>
  <div class="t-price" id="tt-price">2000 руб.</div>
</div>

<div class="toast" id="toast"></div>

<script>
const MAX_SEATS = 4;
const POLL_MS = 5000;
const ADMIN_PASSWORD = "admin123";
let currentEvent = 'left'; // 'left' = Танцы без возраста, 'right' = Живи ярче

let bookedSet = new Set();
let selected  = new Set();
let cancelSeats = new Set();
let isAdminMode = false;

// ==========================================
// ДАННЫЕ ИЗ ВАШЕЙ ТЕКСТОВОЙ СХЕМЫ
// ==========================================
const parterreStrings = [
  "-000000000-000000000000000000000-000000000-", // 1
  "--00000000-000000000000000000000-00000000-",  // 2
  "--00000000-000000000000000000000-00000000-",  // 3
  "--00000000--00000000000000000000-0000000-",   // 4
  "---------------00000000000000000000-----------", // 5
  "---00000000-0000000000000000000--00000000-",  // 6
  "------000000-0000000000000000000--000000-",   // 7
  "-----0000000-0000000000000000000--0000000-",  // 8
  "-----0000000-000000000000000000---0000000-",  // 9
  "------000000-000000000000000000--000000-",    // 10
  "------000000-000000000000000000--000000-",    // 11
  "------000000--00000000000000000--000000-",    // 12
  "------000000--00000000000000000--000000-",    // 13
  "------000000--00000000000000000--000000-",    // 14
  "------000000--00000000000000000--000000-",    // 15
  "-------000000--0000000000000000--000000-",    // 16
  "-------000000--0000000000000000--000000-",    // 17
  "-------000000--0000000000000000-00000-",      // 18
  "--------00000--0000дддддд00000--00000-",      // 19
  "--------00000--0000дддддд00000--00000-",      // 20
  "--------00000--0000дддддд00000--00000-",      // 21
  "------000000000000000000000000000000-",       // 22
  "-----------00000000000000000000----",         // 23
  "------------00000000000000000------",         // 24
  "-----------0000000000000000000----"           // 25
];
const parterreMaxSeats = [39, 37, 37, 35, 20, 35, 31, 33, 32, 30, 30, 29, 29, 29, 29, 28, 28, 27, 19, 19, 19, 30, 20, 17, 19];

const centralStrings = [
  "---------000000000000000000000000000----------", // 1
  "--------0000000000000000000000000000----------", // 2
  "-------00000000000000000000000000000----------", // 3
  "-------000000000000000000000000000000----------", // 4
  "-------00000000000000----00000000000000----------" // 5
];
const centralMaxSeats = [27, 28, 30, 31, 28];

// --- ТОЧНЫЕ ДИАПАЗОНЫ ДЛЯ "ТАНЦЫ БЕЗ ВОЗРАСТА" (Левая часть) ---
// Где 1-й элемент - от какого места, 2-й - до какого (включительно)
const tanci_parterre = {
  1: [19, 39], 2: [18, 37], 3: [18, 37], 4: [17, 35], 5: [10, 20], 
  6: [17, 35], 7: [15, 31], 8: [16, 33], 9: [15, 32], 10: [14, 30], 
  11: [14, 30], 12: [14, 29], 13: [14, 29], 14: [14, 29], 15: [14, 29], 
  16: [14, 28], 17: [14, 28], 18: [13, 27], 19: [11, 19], 20: [11, 19], 21: [11, 19],
  // 22-25 ряды: делим пополам
  22: [15, 30], 23: [10, 20], 24: [9, 17], 25: [10, 19]
};

const tanci_central = {
  1: [14, 27], 2: [14, 28], 3: [15, 30], 4: [16, 31], 5: [15, 28]
};

function getEventSide(zone, row, seatNum) {
  if (zone.includes('left-balc')) return 'left';
  if (zone.includes('right-balc')) return 'right';
  
  if (zone === 'central') {
    const range = tanci_central[row];
    if (range && seatNum >= range[0] && seatNum <= range[1]) return 'left';
    return 'right';
  }
  
  if (zone === 'parterre') {
    const range = tanci_parterre[row];
    if (range && seatNum >= range[0] && seatNum <= range[1]) return 'left';
    return 'right';
  }
  return 'left'; // fallback
}

// Балконы (генерация)
function generateBalcGrid(cols, totalRows, colConfigs) {
  const grid = Array(totalRows).fill(null).map(() => Array(cols).fill(null));
  let seatCounters = Array(cols).fill(1);
  for (let r = totalRows - 1; r >= 0; r--) {
    for (let c = 0; c < cols; c++) {
      if (colConfigs[c].present(r)) grid[r][c] = { num: seatCounters[c]++ };
    }
  }
  return grid;
}
const leftBalcAGrid = generateBalcGrid(4, 18, [{present:()=>true},{present:(r)=>r>=1},{present:(r)=>r>=1},{present:(r)=>r>=2}]);
const rightBalcAGrid = generateBalcGrid(4, 18, [{present:()=>true},{present:(r)=>r>=1},{present:()=>true},{present:(r)=>r>=1}]);
const leftBalcBGrid = generateBalcGrid(2, 20, [{present:(r)=>(r>=0&&r<=5)||r>=9},{present:(r)=>(r>=1&&r<=5)||r>=9}]);
const rightBalcBGrid = generateBalcGrid(2, 20, [{present:(r)=>(r>=0&&r<=5)||r>=9},{present:(r)=>(r>=1&&r<=5)||r>=9}]);

function parseRow(str, maxSeat) {
  const row = [];
  let seatNum = maxSeat;
  let aisleWidth = 0;
  let djCount = 0;
  
  for (let i = 0; i < str.length; i++) {
    const char = str[i];
    if (char === '0') {
      if (djCount > 0) { row.push({ type: 'dj', width: djCount }); djCount = 0; }
      if (aisleWidth > 0) { row.push({ type: 'aisle', width: aisleWidth }); aisleWidth = 0; }
      row.push({ type: 'seat', num: seatNum-- });
    } else if (char === '-') {
      if (djCount > 0) { row.push({ type: 'dj', width: djCount }); djCount = 0; }
      aisleWidth++;
    } else if (char === 'д') {
      if (aisleWidth > 0) { row.push({ type: 'aisle', width: aisleWidth }); aisleWidth = 0; }
      djCount++;
    }
  }
  if (djCount > 0) row.push({ type: 'dj', width: djCount });
  if (aisleWidth > 0) row.push({ type: 'aisle', width: aisleWidth });
  return row;
}

function getPriceAndColor(zone, row) {
  let price = 600, color = '#60a5fa'; 
  if (zone.includes('parterre')) {
    if (row === 1) { price = 1500; color = '#ef4444'; }
    else if (row === 2) { price = 1400; color = '#fca5a5'; }
    else if (row === 3) { price = 1300; color = '#f97316'; }
    else if (row >= 4 && row <= 7) { price = 1100; color = '#eab308'; }
    else if (row >= 8 && row <= 12) { price = 1000; color = '#22c55e'; }
    else if (row >= 13 && row <= 17) { price = 800; color = '#86efac'; }
  }
  return { price, color };
}

function createSeat(key, num, title, color, price, side, zoneName, rowNum) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'seat';
  btn.dataset.key = key;
  btn.dataset.side = side; 
  btn.dataset.zone = zoneName;
  btn.dataset.row = rowNum;
  btn.dataset.seat = num;
  btn.dataset.price = price;
  btn.textContent = num;
  btn.style.background = color;

  if (side !== currentEvent) btn.classList.add('disabled');
  
  if (bookedSet.has(key)) {
    if (bookedSet.has(key + '_blocked')) btn.classList.add('blocked');
    else btn.classList.add('booked');
    btn.disabled = true;
  }
  if (selected.has(key)) btn.classList.add('selected');
  return btn;
}

function switchEvent(event) {
  currentEvent = event;
  document.getElementById('btn-event-left').classList.toggle('active', event === 'left');
  document.getElementById('btn-event-right').classList.toggle('active', event === 'right');
  render();
}

function renderGrid(containerId, gridData, prefix, zoneName, defaultSide, isParterre = false) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  
  gridData.forEach((rowData, rowIndex) => {
    const rowNum = rowIndex + 1;
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';

    const { price, color } = getPriceAndColor(prefix, rowNum);

    rowData.forEach(item => {
      if (isParterre) {
        if (item.type === 'aisle') {
          const a = document.createElement('div'); a.className = 'aisle'; a.style.width = `${item.width * 4.5}px`; rowDiv.appendChild(a);
        } else if (item.type === 'seat') {
          const side = getEventSide(prefix, rowNum, item.num);
          rowDiv.appendChild(createSeat(`${prefix}-${rowNum}-${item.num}`, item.num, `${zoneName} Ряд ${rowNum} Место ${item.num}`, color, price, side, zoneName, rowNum));
        } else if (item.type === 'dj') {
          // Диджейка занимает ровно столько места, сколько символов 'д' (6 шт * 24px)
          const dj = document.createElement('div'); dj.className = 'dj-booth'; 
          dj.style.width = `${item.width * 24}px`; 
          dj.textContent = 'DJ'; 
          rowDiv.appendChild(dj);
        }
      } else {
        if (item === null) {
          const a = document.createElement('div'); a.className = 'aisle'; a.style.width = '20px'; rowDiv.appendChild(a);
        } else {
          let side = defaultSide || getEventSide(prefix, rowNum, item.num);
          rowDiv.appendChild(createSeat(`${prefix}-${rowNum}-${item.num}`, item.num, `${zoneName} Ряд ${rowNum} Место ${item.num}`, color, price, side, zoneName, rowNum));
        }
      }
    });
    container.appendChild(rowDiv);
  });
}

function render() {
  const parterreData = parterreStrings.map((s, i) => parseRow(s, parterreMaxSeats[i]));
  renderGrid('parterre', parterreData, 'parterre', 'Партер', null, true);
  
  const centralData = centralStrings.map((s, i) => parseRow(s, centralMaxSeats[i]));
  renderGrid('central-balc', centralData, 'central', 'Центральный балкон', null, true);
  
  renderGrid('left-balc-b', leftBalcBGrid, 'left-balc-b', 'Левый балкон Б', 'left');
  renderGrid('left-balc-a', leftBalcAGrid, 'left-balc-a', 'Левый балкон А', 'left');
  renderGrid('right-balc-b', rightBalcBGrid, 'right-balc-b', 'Правый балкон Б', 'right');
  renderGrid('right-balc-a', rightBalcAGrid, 'right-balc-a', 'Правый балкон А', 'right');
  
  updateBar();
}

function updateBar(){
  document.getElementById('count').textContent = selected.size;
  document.getElementById('bookBtn').disabled = selected.size === 0;
}

async function loadBookings(){
  try {
    const res = await fetch('/api/bookings', { cache: 'no-store' });
    const data = await res.json();
    bookedSet.clear();
    if (Array.isArray(data)) {
      data.forEach(item => {
        if (typeof item === 'string') bookedSet.add(item);
        else {
          bookedSet.add(item.seat_key);
          if (item.status === 'blocked') bookedSet.add(item.seat_key + '_blocked');
        }
      });
    }
    for (const k of [...selected]) if (bookedSet.has(k)) selected.delete(k);
    render();
  } catch (e) { render(); }
}

// ==== TOOLTIP ЛОГИКА ====
const tooltip = document.getElementById('tooltip');

document.body.addEventListener('mouseover', e => {
  const btn = e.target.closest('.seat');
  if (!btn) return;
  
  const zone = btn.dataset.zone;
  const row = btn.dataset.row;
  const seat = btn.dataset.seat;
  const price = btn.dataset.price;

  document.getElementById('tt-row').textContent = `ряд: ${row}, место: ${seat}`;
  document.getElementById('tt-zone').textContent = zone;
  document.getElementById('tt-price').textContent = `${price} руб.`;
  
  tooltip.style.display = 'block';
});

document.body.addEventListener('mousemove', e => {
  if (tooltip.style.display === 'block') {
    tooltip.style.left = e.clientX + 'px';
    tooltip.style.top = e.clientY + 'px';
  }
});

document.body.addEventListener('mouseout', e => {
  if (e.target.closest('.seat')) {
    tooltip.style.display = 'none';
  }
});

// ==== КЛИКИ И ОСТАЛЬНАЯ ЛОГИКА ====
document.body.addEventListener('click', async e => {
  const btn = e.target.closest('.seat');
  if (!btn || btn.classList.contains('booked') || btn.classList.contains('disabled')) return;
  const key = btn.dataset.key;
  
  if (isAdminMode) {
    if (btn.classList.contains('blocked')) {
      if(confirm('Разблокировать?')) await toggleBlock(key);
    } else {
      if(confirm('ЗАБЛОКИРОВАТЬ место?')) await toggleBlock(key);
    }
    return;
  }

  if (selected.has(key)) {
    selected.delete(key);
    btn.classList.remove('selected');
  } else {
    if (selected.size >= MAX_SEATS) return showToast(`Не более ${MAX_SEATS} мест`);
    selected.add(key);
    btn.classList.add('selected');
  }
  updateBar();
});

async function toggleBlock(seatKey) {
  try {
    const res = await fetch(`/api/admin/toggle-block?pass=${ADMIN_PASSWORD}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ seat: seatKey })
    });
    if (res.ok) loadBookings();
    else { const d = await res.json(); alert(d.error); }
  } catch (e) { alert('Ошибка сети'); }
}

document.getElementById('adminBtn').addEventListener('click', () => {
  if (isAdminMode) {
    isAdminMode = false;
    document.getElementById('adminBtn').classList.remove('active');
    document.getElementById('adminBtn').textContent = 'Войти как Админ';
    showToast('Режим админа выключен');
  } else {
    const pass = prompt('Введите пароль:');
    if (pass === ADMIN_PASSWORD) {
      isAdminMode = true;
      document.getElementById('adminBtn').classList.add('active');
      document.getElementById('adminBtn').textContent = 'Выйти из Админа';
      showToast('Кликайте по местам для блокировки');
    } else if (pass !== null) alert('Неверный пароль');
  }
});

document.getElementById('bookBtn').addEventListener('click', () => {
  if (!selected.size) return;
  document.getElementById('modalSeats').textContent = seatsText();
  document.getElementById('error').textContent = '';
  document.getElementById('bookingForm').reset();
  document.getElementById('modal').hidden = false;
  document.getElementById('fullname').focus();
});

function seatsText(){
  const groups = {};
  for (const key of selected){
    let parts = key.split('-');
    let zone = 'Балкон';
    let r = parts[parts.length-2]; let c = parts[parts.length-1];
    
    if (parts[0] === 'parterre') { zone = 'Партер'; r = parts[1]; c = parts[2]; }
    else if (parts[0] === 'central') { zone = 'Центр. балкон'; r = parts[1]; c = parts[2]; }
    else if (parts[1] === 'balc') { zone = parts[0] === 'left' ? 'Левый балкон' : 'Правый балкон'; r = parts[2]; c = parts[3]; }

    if(!groups[`${zone} Ряд ${r}`]) groups[`${zone} Ряд ${r}`] = [];
    groups[`${zone} Ряд ${r}`].push(Number(c));
  }
  return Object.keys(groups).map(k => `${k}: место ${groups[k].sort((a,b)=>a-b).join(', ')}`).join('\n');
}

document.getElementById('bookingForm').addEventListener('submit', async e => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  const fullname = document.getElementById('fullname').value.trim();
  const phone = document.getElementById('phone').value.trim();
  
  if (fullname.length < 2) { errorEl.textContent = 'Введите имя'; return; }
  if (phone.replace(/\D/g,'').length < 10) { errorEl.textContent = 'Введите телефон'; return; }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true; submitBtn.textContent = '...';

  try {
    const res = await fetch('/api/bookings', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seats: [...selected], fullname, phone })
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error;
      if (res.status === 409) await loadBookings();
      return;
    }
    selected.clear();
    document.getElementById('modal').hidden = true;
    loadBookings();
    showToast('Успешно забронировано!');
  } catch (err) {
    errorEl.textContent = 'Ошибка сети';
  } finally {
    submitBtn.disabled = false; submitBtn.textContent = 'Забронировать';
  }
});

document.getElementById('cancelBtnOpen').addEventListener('click', () => {
  document.getElementById('myBookingsList').style.display = 'none';
  document.getElementById('cancelModal').hidden = false;
});

async function findMyBookings() {
  const phone = document.getElementById('cancelPhone').value.trim();
  const res = await fetch('/api/my-bookings?phone=' + phone);
  const seats = await res.json();
  if (!seats || seats.length === 0) return alert('Не найдено');
  
  const container = document.getElementById('seatsToCancel');
  container.innerHTML = ''; cancelSeats.clear();
  seats.forEach(s => {
    const b = document.createElement('button');
    b.className = 'btn ghost'; b.textContent = s;
    b.onclick = () => {
      if (cancelSeats.has(s)) { cancelSeats.delete(s); b.style.background=''; }
      else { cancelSeats.add(s); b.style.background='#d9534f'; }
    };
    container.appendChild(b);
  });
  document.getElementById('myBookingsList').style.display = 'block';
}

async function cancelBookings() {
  if (!cancelSeats.size) return alert('Выберите места');
  const phone = document.getElementById('cancelPhone').value.trim();
  await fetch('/api/cancel', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({seats:[...cancelSeats], phone}) });
  document.getElementById('cancelModal').hidden = true;
  loadBookings(); showToast('Отменено');
}

let toastTimer;
function showToast(msg){ document.getElementById('toast').textContent=msg; document.getElementById('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>document.getElementById('toast').classList.remove('show'),2500); }

render();
loadBookings();
setInterval(loadBookings, POLL_MS);
</script>
</body>
</html>
